<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GESTIÓN DE NOTIFICACIONES Y UNIFICACIÓN - CREDIBAN PERÚ</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <style>
        .excel-grid-table {
            border-collapse: collapse;
            user-select: none;
        }
        .excel-grid-table th, .excel-grid-table td {
            border: 1px solid #cbd5e1;
        }
        .excel-cell-input {
            width: 100%;
            height: 100%;
            background: transparent;
            outline: none;
            padding: 3px 6px;
            font-size: 11px;
        }
        .excel-cell-input:focus {
            background: #eff6ff;
            box-shadow: inset 0 0 0 2px #16a34a;
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">
    <div id="root"></div>

    <script type="text/babel">
        // ============================================================================
        // CONFIGURACIÓN DE RED DE USUARIOS Y CONSTANTES DEL SISTEMA
        // ============================================================================
        const USER_NETWORK_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPGo-OSC0KZcz03bAMpKQ82cipc2T1LNztaI229FhYqqNNXqG1oSb6hPPgVSSU3piqiw/exec';
        const INITIAL_ROW_COUNT = 350;
        const EXPECTED_COLUMN_COUNT = 19;

        const STORAGE_GRID_KEY = 'crediban_excel_grid_19cols_v2';
        const STORAGE_STATUS_KEY = 'crediban_status_map_19cols_v2';
        const STORAGE_SESSION_KEY = 'crediban_cajero_session_v2';
        const STORAGE_USERS_CACHE_KEY = 'crediban_users_network_cache_v2';

        // DEFINICIÓN EXACTA DE LAS 19 COLUMNAS DE LA HOJA EXCEL
        const EXCEL_COLUMNS = [
            { num: 1,  colLetter: 'B', key: 'cli',         label: 'CLI',           width: 'w-16', align: 'text-center' },
            { num: 2,  colLetter: 'C', key: 'credito',     label: 'CREDITO',       width: 'w-20', align: 'text-center' },
            { num: 3,  colLetter: 'D', key: 'nCuota',      label: 'N CUOTA',       width: 'w-16', align: 'text-center' },
            { num: 4,  colLetter: 'E', key: 'cliente',     label: 'CLIENTE',       width: 'w-64', align: 'text-left' },
            { num: 5,  colLetter: 'F', key: 'atraso',      label: 'ATRASO',        width: 'w-20', align: 'text-center' },
            { num: 6,  colLetter: 'G', key: 'telefono',    label: 'TELEFONO',      width: 'w-28', align: 'text-center' },
            { num: 7,  colLetter: 'H', key: 'saldoCuota',  label: 'SALDO- CUOTA',  width: 'w-28', align: 'text-right' },
            { num: 8,  colLetter: 'I', key: 'saldoKCuota', label: 'SALDO K CUOTA', width: 'w-28', align: 'text-right' },
            { num: 9,  colLetter: 'J', key: 'separador',   label: 'SEPARADOR',     width: 'w-20', align: 'text-center', isSeparator: true },
            { num: 10, colLetter: 'K', key: 'totalSaldo',  label: 'TOTAL. SALDO',  width: 'w-28', align: 'text-right' },
            { num: 11, colLetter: 'L', key: 'direccion',   label: 'DIRECCION',     width: 'w-56', align: 'text-left' },
            { num: 12, colLetter: 'M', key: 'referencia',  label: 'S REFERENCIA',  width: 'w-48', align: 'text-left' },
            { num: 13, colLetter: 'N', key: 'desembolso',  label: 'DESEMBOLSO',    width: 'w-28', align: 'text-right' },
            { num: 14, colLetter: 'O', key: 'saldoKCred',  label: 'SALDO K CRED',  width: 'w-28', align: 'text-right' },
            { num: 15, colLetter: 'P', key: 'plazo',       label: 'PLAZO',         width: 'w-24', align: 'text-center' },
            { num: 16, colLetter: 'Q', key: 'cuotaOrig',   label: 'CUOTA ORIG',    width: 'w-28', align: 'text-right' },
            { num: 17, colLetter: 'R', key: 'moraCuota',   label: 'MORA CUOTA',    width: 'w-28', align: 'text-right' },
            { num: 18, colLetter: 'S', key: 'grupo',       label: 'GRUPO',         width: 'w-24', align: 'text-center' },
            { num: 19, colLetter: 'T', key: 'asesor',      label: 'ASESOR',        width: 'w-40', align: 'text-left' }
        ];

        const createEmptyExcelRow = () => ({
            cli: '', credito: '', nCuota: '', cliente: '', atraso: '', telefono: '',
            saldoCuota: '', saldoKCuota: '', separador: '', totalSaldo: '', direccion: '', referencia: '',
            desembolso: '', saldoKCred: '', plazo: '', cuotaOrig: '', moraCuota: '', grupo: '', asesor: ''
        });

        const isRowEmpty = (r) => !r || !Object.values(r).some(v => String(v || '').trim() !== '');

        const createInitialEmptyGrid = (count = INITIAL_ROW_COUNT) =>
            Array.from({ length: count }, () => createEmptyExcelRow());

        const padGridToMinimum = (rows, minCount = INITIAL_ROW_COUNT) => {
            if (rows.length >= minCount) return rows;
            return [...rows, ...createInitialEmptyGrid(minCount - rows.length)];
        };

        const LLAMADA_OPTIONS = [
            "Pendiente",
            "Contestó Positivo",
            "Promesa Pago",
            "No Contesta",
            "Nro. Equivocado",
            "Bloqueado"
        ];

        const WA_OPTIONS = [
            "Pendiente",
            "Respondió",
            "Promesa Pago",
            "No Responde",
            "Bloqueado"
        ];

        const priorityScore = (val) => {
            if (!val) return 99;
            if (val.includes('Promesa')) return 1;
            if (val.includes('Positivo') || val.includes('Respondió')) return 2;
            if (val === 'Pendiente') return 3;
            if (val.includes('No Contesta') || val.includes('No Responde')) return 4;
            return 5;
        };

        const getBestPriority = (client) => {
            return Math.min(priorityScore(client.estadoLlamada), priorityScore(client.estadoWA));
        };

        const getDropdownColor = (val) => {
            if (!val) return 'bg-white text-gray-700 border-gray-300';
            if (val.includes('Positivo') || val.includes('Respondió')) return 'bg-green-100 text-green-800 border-green-300';
            if (val.includes('Promesa')) return 'bg-blue-100 text-blue-800 border-blue-300';
            if (val.includes('No Contesta') || val.includes('No Responde')) return 'bg-yellow-100 text-yellow-800 border-yellow-300';
            if (val.includes('Equivocado') || val.includes('Bloqueado')) return 'bg-red-100 text-red-800 border-red-300';
            return 'bg-white text-gray-700 border-gray-300';
        };

        const stripEmojis = (str) => {
            if (!str) return '';
            return String(str).replace(/[📞📱🚫🚨✅⚠️💬📲⚡]/g, '').trim();
        };

        const toTitleCase = (str) => {
            if (!str) return '';
            return String(str).replace(/\w\S*/g, (txt) => {
                return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
            }).replace(/\s+/g, ' ').trim();
        };

        const parseNumber = (val) => {
            if (typeof val === 'number') return val;
            if (val === null || val === undefined) return 0;
            let cleaned = String(val).replace(/S\/|s\/|\$|,/g, '').replace(/\s+/g, '').trim();
            if (cleaned.startsWith('.')) cleaned = '0' + cleaned;
            const num = parseFloat(cleaned);
            return isNaN(num) ? 0 : num;
        };

        const parseIntSafe = (val, fallback = NaN) => {
            if (typeof val === 'number') return Math.trunc(val);
            if (val === null || val === undefined) return fallback;
            const cleaned = String(val).replace(/,/g, '').trim();
            if (cleaned === '') return fallback;
            const match = cleaned.match(/^(-?\d+)/);
            return match ? parseInt(match[1], 10) : fallback;
        };

        const splitLineSafe = (line, separator) => {
            if (separator === '\t') {
                return line.split('\t').map(s => s.trim().replace(/^"|"$/g, ''));
            }
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const char = line[i];
                if (char === '"') {
                    inQuotes = !inQuotes;
                } else if (char === separator && !inQuotes) {
                    result.push(current);
                    current = '';
                } else {
                    current += char;
                }
            }
            result.push(current);
            return result.map(s => s.trim().replace(/^"|"$/g, ''));
        };

        // ============================================================================
        // NORMALIZADOR INTELIGENTE DE RED DE USUARIOS (SOLO CATEGORÍA CAJERO)
        // ============================================================================
        const normalizeUsersFromPayload = (payload) => {
            if (!payload) return [];
            let rawList = [];

            if (Array.isArray(payload)) {
                rawList = payload;
            } else if (typeof payload === 'object') {
                const candidateKeys = ['usuarios', 'users', 'data', 'registros', 'personal', 'items', 'values', 'result'];
                for (let k of candidateKeys) {
                    if (Array.isArray(payload[k])) {
                        rawList = payload[k];
                        break;
                    }
                }
                if (rawList.length === 0) {
                    const firstArr = Object.values(payload).find(v => Array.isArray(v));
                    if (firstArr) rawList = firstArr;
                }
            }

            if (rawList.length === 0) return [];

            const normalized = [];

            // Si es una matriz 2D (filas de Google Sheets)
            if (Array.isArray(rawList[0])) {
                const firstRowUpper = rawList[0].map(c => String(c || '').toUpperCase().trim());
                const hasHeaders = firstRowUpper.some(h =>
                    h.includes('USUARIO') || h.includes('NOMBRE') || h.includes('CLAVE') || h.includes('CARGO') || h.includes('CATEGORIA') || h.includes('ROL')
                );

                let idxUser = 0, idxPass = 1, idxRole = 2, idxSede = 3, idxEstado = 4;
                if (hasHeaders) {
                    const fUser = firstRowUpper.findIndex(h => h.includes('USUARIO') || h.includes('NOMBRE') || h.includes('USER'));
                    const fPass = firstRowUpper.findIndex(h => h.includes('CLAVE') || h.includes('CONTRASE') || h.includes('PASS') || h.includes('PIN'));
                    const fRole = firstRowUpper.findIndex(h => h.includes('CATEGORIA') || h.includes('CARGO') || h.includes('ROL') || h.includes('RANGO') || h.includes('PUESTO') || h.includes('TIPO'));
                    const fSede = firstRowUpper.findIndex(h => h.includes('SEDE') || h.includes('AGENCIA') || h.includes('OFICINA'));
                    const fEst  = firstRowUpper.findIndex(h => h.includes('ESTADO') || h.includes('ACTIVO'));

                    if (fUser !== -1) idxUser = fUser;
                    if (fPass !== -1) idxPass = fPass;
                    if (fRole !== -1) idxRole = fRole;
                    if (fSede !== -1) idxSede = fSede;
                    if (fEst !== -1)  idxEstado = fEst;
                }

                const startIdx = hasHeaders ? 1 : 0;
                for (let i = startIdx; i < rawList.length; i++) {
                    const r = rawList[i];
                    if (!Array.isArray(r) || r.length === 0) continue;
                    const usuario = String(r[idxUser] ?? '').trim();
                    const clave = String(r[idxPass] ?? '').trim();
                    let categoria = String(r[idxRole] ?? '').trim();
                    const sede = String(r[idxSede] ?? 'General').trim();
                    const estado = String(r[idxEstado] ?? 'ACTIVO').trim().toUpperCase();

                    // Si la categoría estaba en otra columna, buscar si alguna celda dice CAJERO / ASESOR / GERENTE / ADMINISTRADOR
                    if (!categoria || (!categoria.toUpperCase().includes('CAJ') && !categoria.toUpperCase().includes('ASESOR') && !categoria.toUpperCase().includes('ADMIN') && !categoria.toUpperCase().includes('GERENT') && !categoria.toUpperCase().includes('TRABAJ'))) {
                        const foundRoleCell = r.find(cell => {
                            const u = String(cell || '').toUpperCase().trim();
                            return u.includes('CAJER') || u === 'CAJA' || u.includes('ASESOR') || u.includes('ADMIN') || u.includes('GERENT') || u.includes('TRABAJ');
                        });
                        if (foundRoleCell) categoria = String(foundRoleCell).trim();
                    }

                    if (usuario && estado !== 'INACTIVO' && estado !== 'BAJA') {
                        normalized.push({ usuario, clave, categoria: categoria || 'CAJERO', sede });
                    }
                }
            } else {
                // Si es un arreglo de objetos JSON
                rawList.forEach(obj => {
                    if (!obj || typeof obj !== 'object') return;
                    const keys = Object.keys(obj);
                    const getByKeyMatch = (patterns) => {
                        for (let p of patterns) {
                            const k = keys.find(key => key.toUpperCase().includes(p));
                            if (k && obj[k] !== undefined && obj[k] !== null && String(obj[k]).trim() !== '') {
                                return String(obj[k]).trim();
                            }
                        }
                        return '';
                    };

                    const usuario = getByKeyMatch(['USUARIO', 'NOMBRE', 'USER', 'CLIENTE', 'TRABAJADOR']);
                    const clave = getByKeyMatch(['CLAVE', 'CONTRASE', 'PASS', 'PIN', 'CODIGO']);
                    let categoria = getByKeyMatch(['CATEGORIA', 'CARGO', 'ROL', 'RANGO', 'TIPO', 'PUESTO', 'NIVEL']);
                    const sede = getByKeyMatch(['SEDE', 'AGENCIA', 'OFICINA', 'ZONA']) || 'General';
                    const estado = getByKeyMatch(['ESTADO', 'STATUS', 'ACTIVO']).toUpperCase();

                    if (!categoria) {
                        const anyRoleVal = Object.values(obj).find(val => {
                            const u = String(val || '').toUpperCase().trim();
                            return u.includes('CAJER') || u === 'CAJA' || u.includes('ASESOR') || u.includes('ADMIN') || u.includes('GERENT') || u.includes('TRABAJ');
                        });
                        if (anyRoleVal) categoria = String(anyRoleVal).trim();
                    }

                    if (usuario && estado !== 'INACTIVO' && estado !== 'BAJA') {
                        normalized.push({ usuario, clave, categoria: categoria || 'SIN CATEGORIA', sede });
                    }
                });
            }

            return normalized;
        };

        const isCajeroRole = (categoriaStr) => {
            const upper = String(categoriaStr || '').toUpperCase().trim();
            return upper.includes('CAJER') || upper === 'CAJA' || upper.includes('GESTOR DE CAJA');
        };

        // ============================================================================
        // DECODIFICADOR DE TEXTO PEGADO DE EXCEL A LAS 19 COLUMNAS
        // ============================================================================
        const convertPastedTextToExcelRows = (rawText) => {
            if (!rawText || !rawText.trim()) return { rows: [], maxColsDetected: 0, incompleteRowsCount: 0 };
            const lines = rawText.split(/\r?\n/).filter(l => l.trim() !== '');
            if (lines.length === 0) return { rows: [], maxColsDetected: 0, incompleteRowsCount: 0 };

            const firstNonEmpty = lines[0];
            let sep = '\t';
            if (!firstNonEmpty.includes('\t')) {
                sep = firstNonEmpty.includes(';') ? ';' : ',';
            }

            let headerRowIdx = -1;
            for (let i = 0; i < Math.min(8, lines.length); i++) {
                const upper = lines[i].toUpperCase();
                if (
                    (upper.includes('CREDITO') || upper.includes('CREDIT')) &&
                    (upper.includes('ATRASO') || upper.includes('ATRAS'))
                ) {
                    headerRowIdx = i;
                    break;
                }
            }

            const startIdx = headerRowIdx !== -1 ? headerRowIdx + 1 : 0;
            const parsedGridRows = [];
            let maxColsDetected = 0;
            let incompleteRowsCount = 0;

            for (let i = startIdx; i < lines.length; i++) {
                const cols = splitLineSafe(lines[i], sep);
                if (cols.every(c => !c || c.trim() === '')) continue;

                if (cols.length > maxColsDetected) {
                    maxColsDetected = cols.length;
                }

                const joinedUpper = cols.join(' ').toUpperCase();
                if (!joinedUpper.includes('ASESOR:') && cols.length < EXPECTED_COLUMN_COUNT) {
                    incompleteRowsCount += 1;
                }

                parsedGridRows.push({
                    cli:         cols[0]  || '',
                    credito:     cols[1]  || '',
                    nCuota:      cols[2]  || '',
                    cliente:     cols[3]  || '',
                    atraso:      cols[4]  || '',
                    telefono:    cols[5]  || '',
                    saldoCuota:  cols[6]  || '',
                    saldoKCuota: cols[7]  || '',
                    separador:   cols[8]  || '',
                    totalSaldo:  cols[9]  || '',
                    direccion:   cols[10] || '',
                    referencia:  cols[11] || '',
                    desembolso:  cols[12] || '',
                    saldoKCred:  cols[13] || '',
                    plazo:       cols[14] || '',
                    cuotaOrig:   cols[15] || '',
                    moraCuota:   cols[16] || '',
                    grupo:       cols[17] || '',
                    asesor:      cols[18] || ''
                });
            }

            return { rows: parsedGridRows, maxColsDetected, incompleteRowsCount };
        };

        const auditGridColumns = (gridRows) => {
            const activeRows = gridRows.filter(r => !isRowEmpty(r));
            if (activeRows.length === 0) return null;

            const mainRows = activeRows.filter(r => {
                const joined = Object.values(r).join(' ').toUpperCase();
                if (joined.includes('ASESOR:')) return false;
                return String(r.cli || '').trim() !== '' || String(r.cliente || '').trim() !== '' || String(r.credito || '').trim() !== '';
            });

            if (mainRows.length === 0) return null;

            const missingColsSet = new Set();
            mainRows.forEach(r => {
                if (!String(r.cli || '').trim()) missingColsSet.add('1. CLI');
                if (!String(r.credito || '').trim()) missingColsSet.add('2. CREDITO');
                if (!String(r.nCuota || '').trim()) missingColsSet.add('3. N CUOTA');
                if (!String(r.cliente || '').trim()) missingColsSet.add('4. CLIENTE');
                if (String(r.atraso ?? '').trim() === '') missingColsSet.add('5. ATRASO');
                if (!String(r.telefono || '').trim()) missingColsSet.add('6. TELEFONO');
                if (!String(r.saldoCuota || '').trim()) missingColsSet.add('7. SALDO- CUOTA');
                if (!String(r.saldoKCuota || '').trim()) missingColsSet.add('8. SALDO K CUOTA');
                if (!String(r.totalSaldo || '').trim()) missingColsSet.add('10. TOTAL. SALDO');
                if (!String(r.direccion || '').trim()) missingColsSet.add('11. DIRECCION');
                if (!String(r.desembolso || '').trim()) missingColsSet.add('13. DESEMBOLSO');
                if (!String(r.saldoKCred || '').trim()) missingColsSet.add('14. SALDO K CRED');
                if (!String(r.plazo || '').trim()) missingColsSet.add('15. PLAZO');
                if (!String(r.cuotaOrig || '').trim()) missingColsSet.add('16. CUOTA ORIG');
                if (String(r.moraCuota ?? '').trim() === '') missingColsSet.add('17. MORA CUOTA');
            });

            const anyAsesor = activeRows.some(r =>
                String(r.asesor || '').trim() !== '' ||
                Object.values(r).join(' ').toUpperCase().includes('ASESOR:')
            );
            if (!anyAsesor) {
                missingColsSet.add('19. ASESOR');
            }

            if (missingColsSet.size === 0) return null;
            return Array.from(missingColsSet);
        };

        // ============================================================================
        // MOTOR DE UNIFICACIÓN DESDE LAS 19 COLUMNAS DE LA HOJA EXCEL
        // ============================================================================
        const unifyFromExcelGrid = (gridRows, statusMap = {}) => {
            const normalizedInstallments = [];

            let currentCli = '';
            let currentCredito = '';
            let currentCliente = 'Desconocido';
            let currentTelefono = 'Sin número';
            let currentDireccion = '';
            let currentReferencia = '';
            let currentDesembolso = 0;
            let currentSaldoKCred = 0;
            let currentTotalSaldo = 0;
            let currentPlazo = '';
            let currentGrupo = '';
            let currentAsesor = 'Sin Asesor';
            let creditBlockCounter = 0;
            let lastRowHadBlankClient = false;

            for (let i = 0; i < gridRows.length; i++) {
                const row = gridRows[i];
                if (isRowEmpty(row)) continue;

                const rowValuesJoined = Object.values(row).join(' ');
                if (rowValuesJoined.toUpperCase().includes('ASESOR:')) {
                    const cellWithAsesor = Object.values(row).find(v => v && String(v).toUpperCase().includes('ASESOR:'));
                    if (cellWithAsesor) {
                        currentAsesor = String(cellWithAsesor).replace(/ASESOR:/i, '').trim() || 'Sin Asesor';
                    }
                    continue;
                }

                const rawCliente = String(row.cliente || '').trim();
                const rawCredito = String(row.credito || '').trim();
                const rawCli = String(row.cli || '').trim();
                const rawAsesor = String(row.asesor || '').trim();

                if (rawCliente.toUpperCase() === 'CLIENTE' || String(row.atraso).toUpperCase() === 'ATRASO') {
                    continue;
                }

                let startsNewCreditBlock = false;
                if (rawCredito !== '' && rawCredito !== currentCredito) {
                    startsNewCreditBlock = true;
                } else if (rawCliente !== '' && rawCliente.toUpperCase() !== currentCliente.toUpperCase()) {
                    startsNewCreditBlock = true;
                } else if (rawCliente !== '' && lastRowHadBlankClient) {
                    startsNewCreditBlock = true;
                }

                if (startsNewCreditBlock) {
                    creditBlockCounter += 1;
                    if (rawCliente !== '') currentCliente = rawCliente.replace(/\s+/g, ' ');
                    if (rawCli !== '') currentCli = rawCli;
                    currentCredito = rawCredito || `LINEA_${creditBlockCounter}`;
                    currentDesembolso = 0;
                    currentSaldoKCred = 0;
                    currentTotalSaldo = 0;
                    currentPlazo = '';
                }

                lastRowHadBlankClient = (rawCliente === '');

                if (rawCliente !== '') currentCliente = rawCliente.replace(/\s+/g, ' ');
                if (rawCli !== '') currentCli = rawCli;
                if (rawCredito !== '') currentCredito = rawCredito;
                if (row.telefono && String(row.telefono).trim() !== '') currentTelefono = String(row.telefono).trim();
                if (row.direccion && String(row.direccion).trim() !== '') currentDireccion = String(row.direccion).trim();
                if (row.referencia && String(row.referencia).trim() !== '') currentReferencia = String(row.referencia).trim();
                if (row.grupo && String(row.grupo).trim() !== '') currentGrupo = String(row.grupo).trim();
                if (rawAsesor !== '') currentAsesor = rawAsesor;

                const desembolsoVal = parseNumber(row.desembolso);
                if (desembolsoVal > 0) currentDesembolso = desembolsoVal;

                const saldoKCredVal = parseNumber(row.saldoKCred);
                if (saldoKCredVal > 0) currentSaldoKCred = saldoKCredVal;

                const totalSaldoVal = parseNumber(row.totalSaldo);
                if (totalSaldoVal > 0) currentTotalSaldo = totalSaldoVal;

                if (row.plazo && String(row.plazo).trim() !== '') {
                    currentPlazo = String(row.plazo).trim();
                }

                const nCuota = parseIntSafe(row.nCuota, 0);
                const atraso = parseIntSafe(row.atraso, NaN);
                const cuotaOrig = parseNumber(row.cuotaOrig);
                const moraCuota = parseNumber(row.moraCuota);
                const saldoCuotaRaw = parseNumber(row.saldoCuota);
                const saldoKCuota = parseNumber(row.saldoKCuota);

                const saldoCuota = saldoCuotaRaw > 0 ? saldoCuotaRaw : (cuotaOrig + moraCuota);
                const finalCuotaOrig = cuotaOrig > 0 ? cuotaOrig : Math.max(0, saldoCuota - moraCuota);
                const finalMora = moraCuota > 0 ? moraCuota : Math.max(0, saldoCuota - finalCuotaOrig);

                let plazoTotalNum = 0;
                if (currentPlazo) {
                    const match = String(currentPlazo).match(/(\d+)/);
                    if (match) plazoTotalNum = parseInt(match[1], 10);
                }

                if (!isNaN(atraso) && saldoCuota > 0 && currentCliente !== 'Desconocido') {
                    normalizedInstallments.push({
                        rowIndexInGrid: i,
                        cli: currentCli,
                        credito: currentCredito || `BLK_${creditBlockCounter}`,
                        blockId: creditBlockCounter,
                        nCuota,
                        cliente: currentCliente,
                        atraso,
                        telefono: currentTelefono,
                        saldoCuota,
                        saldoKCuota,
                        totalSaldo: currentTotalSaldo,
                        direccion: currentDireccion,
                        referencia: currentReferencia,
                        desembolso: currentDesembolso,
                        saldoKCred: currentSaldoKCred,
                        plazoRaw: currentPlazo || (plazoTotalNum > 0 ? `${plazoTotalNum} cuotas` : '-'),
                        plazoTotal: plazoTotalNum,
                        cuotaOrig: finalCuotaOrig,
                        moraCuota: finalMora,
                        grupo: currentGrupo,
                        asesor: currentAsesor
                    });
                }
            }

            const grouped = {};
            normalizedInstallments.forEach(item => {
                const clientCleanKey = item.cliente.toUpperCase().trim();
                const creditKey = `${clientCleanKey}__${item.credito}`;

                if (!grouped[creditKey]) {
                    const savedState = statusMap[creditKey] || {};
                    grouped[creditKey] = {
                        id: creditKey,
                        clientKey: clientCleanKey,
                        cli: item.cli,
                        credito: item.credito.startsWith('LINEA_') || item.credito.startsWith('BLK_') ? '' : item.credito,
                        nombre: item.cliente,
                        celular: item.telefono,
                        direccion: item.direccion,
                        referencia: item.referencia,
                        grupo: item.grupo,
                        asesor: item.asesor,
                        plazoRaw: item.plazoRaw,

                        montoDesembolsado: 0,
                        saldoCapital: 0,
                        sumaSaldoKCuotas: 0,
                        totalSaldoReportado: 0,
                        cuotaBase: 0,
                        deudaTotalRestante: 0,

                        cuotaOriginalVencida: 0,
                        moraGeneradaVencida: 0,
                        totalCobrarHoy: 0,
                        montoPorVencerFuturo: 0,

                        cuotaMasAntiguaBase: 0,
                        cuotaMasAntiguaTotal: 0,

                        cuotasAtrasadas: 0,
                        cuotasVenceHoy: 0,
                        cuotasPorVencer: 0,
                        totalCuotasPendientes: 0,

                        maxAtraso: -9999,
                        minCuotaPendiente: 9999,
                        plazoTotalCredito: 0,

                        cuotasDetalle: [],
                        gridRowIndices: [],

                        estadoLlamada: savedState.estadoLlamada || 'Pendiente',
                        estadoWA: savedState.estadoWA || 'Pendiente',
                        selected: savedState.selected || false
                    };
                }

                const g = grouped[creditKey];
                g.gridRowIndices.push(item.rowIndexInGrid);

                g.cuotasDetalle.push({
                    nCuota: item.nCuota || (g.cuotasDetalle.length + 1),
                    atraso: item.atraso,
                    cuotaOrig: item.cuotaOrig,
                    moraCuota: item.moraCuota,
                    saldoCuota: item.saldoCuota,
                    saldoKCuota: item.saldoKCuota
                });

                if (item.desembolso > g.montoDesembolsado) g.montoDesembolsado = item.desembolso;
                if (item.saldoKCred > g.saldoCapital) g.saldoCapital = item.saldoKCred;
                if (item.totalSaldo > g.totalSaldoReportado) g.totalSaldoReportado = item.totalSaldo;
                if (item.cuotaOrig > g.cuotaBase) g.cuotaBase = item.cuotaOrig;
                g.sumaSaldoKCuotas += item.saldoKCuota;

                if (item.atraso > g.maxAtraso) {
                    g.maxAtraso = item.atraso;
                    g.cuotaMasAntiguaBase = item.cuotaOrig;
                    g.cuotaMasAntiguaTotal = item.saldoCuota;
                }

                if (item.nCuota > 0 && item.nCuota < g.minCuotaPendiente) {
                    g.minCuotaPendiente = item.nCuota;
                }
                if (item.plazoTotal > g.plazoTotalCredito) {
                    g.plazoTotalCredito = item.plazoTotal;
                }

                g.deudaTotalRestante += item.saldoCuota;
                g.totalCuotasPendientes += 1;

                if (item.atraso > 0) {
                    g.cuotasAtrasadas += 1;
                    g.totalCobrarHoy += item.saldoCuota;
                    g.cuotaOriginalVencida += item.cuotaOrig;
                    g.moraGeneradaVencida += item.moraCuota;
                } else if (item.atraso === 0) {
                    g.cuotasVenceHoy += 1;
                    g.totalCobrarHoy += item.saldoCuota;
                    g.cuotaOriginalVencida += item.cuotaOrig;
                    g.moraGeneradaVencida += item.moraCuota;
                } else {
                    g.cuotasPorVencer += 1;
                    g.montoPorVencerFuturo += item.saldoCuota;
                }
            });

            const byClient = {};
            Object.values(grouped).forEach(line => {
                if (!byClient[line.clientKey]) byClient[line.clientKey] = [];
                byClient[line.clientKey].push(line);
            });

            return Object.values(grouped).map(client => {
                if (client.saldoCapital === 0 && client.sumaSaldoKCuotas > 0) {
                    client.saldoCapital = client.sumaSaldoKCuotas;
                }

                const siblings = byClient[client.clientKey] || [client];
                client.tieneParalela = siblings.length > 1;
                client.totalLineasCliente = siblings.length;
                client.numeroLinea = siblings.findIndex(s => s.id === client.id) + 1;
                client.otrasLineasResumen = siblings
                    .filter(s => s.id !== client.id)
                    .map(s => ({
                        credito: s.credito,
                        desembolso: s.montoDesembolsado,
                        plazoRaw: s.plazoRaw,
                        maxAtraso: s.maxAtraso,
                        totalCobrarHoy: s.totalCobrarHoy
                    }));

                if (client.maxAtraso > 0) client.condicion = 'En Mora';
                else if (client.maxAtraso === 0) client.condicion = 'Vence Hoy';
                else client.condicion = 'Por Vencer';

                client.cuotasDetalle.sort((a, b) => b.atraso - a.atraso || a.nCuota - b.nCuota);

                const cuotasPagadas = client.minCuotaPendiente === 9999 ? 0 : Math.max(0, client.minCuotaPendiente - 1);
                client.avancePorcentaje = client.plazoTotalCredito > 0
                    ? Math.min(100, (cuotasPagadas / client.plazoTotalCredito) * 100)
                    : 0;

                const cuotasRestantes = client.plazoTotalCredito > 0
                    ? Math.max(client.totalCuotasPendientes, client.plazoTotalCredito - cuotasPagadas)
                    : client.totalCuotasPendientes;

                client.montoCancelarCapInt = (cuotasRestantes * client.cuotaBase) > 0
                    ? (cuotasRestantes * client.cuotaBase)
                    : client.deudaTotalRestante;

                return client;
            }).sort((a, b) => b.totalCobrarHoy - a.totalCobrarHoy || b.maxAtraso - a.maxAtraso);
        };

        // FILA MEMOIZADA DE LA HOJA EXCEL PARA 350+ FILAS RÁPIDAS

        // ============================================================================
        // PANTALLA DE BLOQUEO CONECTADA A LA RED DE USUARIOS (SOLO CATEGORÍA CAJERO)
        // ============================================================================
        function LoginScreen({ onLoginSuccess, usersList, isLoadingUsers, syncError, onRetrySync }) {
            const [username, setUsername] = React.useState('');
            const [password, setPassword] = React.useState('');
            const [rememberMe, setRememberMe] = React.useState(true);
            const [authError, setAuthError] = React.useState('');
            const [isValidating, setIsValidating] = React.useState(false);

            const handleSubmit = async (e) => {
                e.preventDefault();
                setAuthError('');
                const cleanUser = username.trim();
                const cleanPass = password.trim();

                if (!cleanUser || !cleanPass) {
                    setAuthError('Ingrese su usuario y contraseña para continuar.');
                    return;
                }

                setIsValidating(true);

                // 1. Validar contra la lista descargada del Script de Red de Usuarios
                if (usersList && usersList.length > 0) {
                    const matchedUser = usersList.find(u =>
                        u.usuario.toUpperCase() === cleanUser.toUpperCase() &&
                        String(u.clave) === String(cleanPass)
                    );

                    if (matchedUser) {
                        if (!isCajeroRole(matchedUser.categoria)) {
                            setIsValidating(false);
                            setAuthError(`⛔ ACCESO RESTRINGIDO: El usuario "${matchedUser.usuario}" pertenece a la categoría "${matchedUser.categoria}". Solo usuarios con categoría CAJERO pueden ingresar.`);
                            return;
                        }
                        setIsValidating(false);
                        onLoginSuccess(matchedUser, rememberMe);
                        return;
                    }
                }

                // 2. Intentar validación directa por POST/GET al Script por si el endpoint valida individualmente
                try {
                    const queryUrl = `${USER_NETWORK_SCRIPT_URL}?action=login&usuario=${encodeURIComponent(cleanUser)}&clave=${encodeURIComponent(cleanPass)}`;
                    const res = await fetch(queryUrl);
                    if (res.ok) {
                        const data = await res.json();
                        const extracted = normalizeUsersFromPayload(data);
                        if (extracted.length > 0) {
                            const found = extracted.find(u =>
                                u.usuario.toUpperCase() === cleanUser.toUpperCase() &&
                                String(u.clave) === String(cleanPass)
                            );
                            if (found) {
                                if (!isCajeroRole(found.categoria)) {
                                    setIsValidating(false);
                                    setAuthError(`⛔ ACCESO RESTRINGIDO: Tu categoría es "${found.categoria}". Solo la categoría CAJERO está autorizada.`);
                                    return;
                                }
                                setIsValidating(false);
                                onLoginSuccess(found, rememberMe);
                                return;
                            }
                        } else if (data && (data.success || data.ok || data.estado === 'exito' || data.status === 'ok')) {
                            const roleReturned = data.categoria || data.cargo || data.rol || data.rango || 'CAJERO';
                            if (!isCajeroRole(roleReturned)) {
                                setIsValidating(false);
                                setAuthError(`⛔ ACCESO RESTRINGIDO: Tu categoría es "${roleReturned}". Solo la categoría CAJERO está autorizada.`);
                                return;
                            }
                            setIsValidating(false);
                            onLoginSuccess({
                                usuario: data.usuario || cleanUser,
                                clave: cleanPass,
                                categoria: roleReturned,
                                sede: data.sede || 'General'
                            }, rememberMe);
                            return;
                        }
                    }
                } catch (err) {
                    // Continuar a verificación de respaldo si falla la red
                }

                // 3. Respaldo Maestro de Caja en caso de caída de red o acceso maestro de Caja
                if ((cleanUser.toUpperCase() === 'CAJERO' || cleanUser.toUpperCase() === 'CAJA' || cleanUser.toUpperCase() === 'ADMINCAJA') && cleanPass === 'CREDICAJA123') {
                    setIsValidating(false);
                    onLoginSuccess({
                        usuario: cleanUser.toUpperCase(),
                        clave: cleanPass,
                        categoria: 'CAJERO',
                        sede: 'SEDE CENTRAL'
                    }, rememberMe);
                    return;
                }

                setIsValidating(false);
                setAuthError('Usuario o contraseña incorrectos, o no pertenece a la categoría CAJERO.');
            };

            const cajerosCount = (usersList || []).filter(u => isCajeroRole(u.categoria)).length;

            return (
                <div className="min-h-screen bg-slate-100 flex items-center justify-center p-4 font-sans">
                    <div className="bg-white max-w-md w-full p-8 rounded-2xl shadow-2xl border-t-[6px] border-[#16a34a]">

                            Acceso Exclusivo - Caja
                        </h2>
                        <p className="text-gray-500 text-xs text-center mb-4">
                            Gestión de Notificaciones y Unificación - CREDIBAN PERÚ
                        </p>

                        {/* Estado de Red de Usuarios */}
                        <div className="mb-5 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 flex items-center justify-between text-xs">
                            {isLoadingUsers ? (
                                <span className="text-blue-700 font-semibold flex items-center gap-2">
                                    🔄 Sincronizando Red de Usuarios...
                                </span>
                            ) : syncError ? (
                                <span className="text-amber-700 font-semibold">
                                    ⚠️ Red en modo caché ({usersList.length} usuarios)
                                </span>
                            ) : (
                                <span className="text-emerald-700 font-bold">
                                    🟢 Red Conectada ({cajerosCount > 0 ? `${cajerosCount} Cajeros activos` : `${usersList.length} usuarios`})
                                </span>
                            )}
                            <button
                                type="button"
                                onClick={onRetrySync}
                                className="text-[11px] text-slate-600 hover:text-green-700 font-bold underline"
                            >
                                Actualizar
                            </button>
                        </div>

                        <form onSubmit={handleSubmit} className="space-y-4">

                                    list="cajeros-datalist"
                                    placeholder="Ingrese su usuario..."
                                    className="w-full px-4 py-3 border-2 border-slate-300 rounded-xl focus:outline-none focus:border-[#16a34a] text-slate-800 font-semibold text-sm"
                                    value={username}
                                    onChange={(e) => { setUsername(e.target.value); setAuthError(''); }}
                                    autoFocus
                                />
                                <datalist id="cajeros-datalist">
                                    {(usersList || []).filter(u => isCajeroRole(u.categoria)).map((u, idx) => (
                                        <option key={idx} value={u.usuario}>{u.categoria} - {u.sede}</option>
                                    ))}
                                </datalist>
                            </div>

                            <div>
                                <label className="block text-xs font-extrabold text-slate-700 uppercase mb-1">
                                    🔒 Contraseña
                                </label>
                                <input
                                    type="password"
                                    placeholder="Ingrese su contraseña..."
                                    className="w-full px-4 py-3 border-2 border-slate-300 rounded-xl focus:outline-none focus:border-[#16a34a] text-slate-800 font-semibold text-sm"
                                    value={password}
                                    onChange={(e) => { setPassword(e.target.value); setAuthError(''); }}
                                />
                            </div>

                            <div className="flex items-center justify-between text-xs text-slate-600 pt-1">
                                <label className="flex items-center gap-2 cursor-pointer font-medium">
                                    <input
                                        type="checkbox"
                                        checked={rememberMe}
                                        onChange={(e) => setRememberMe(e.target.checked)}
                                        className="w-4 h-4 text-green-600 rounded"
                                    />
                                    Mantener sesión iniciada
                                </label>
                                <span className="px-2 py-0.5 bg-emerald-100 text-emerald-800 rounded font-bold text-[10px]">
                                    SOLO CAJEROS
                                </span>
                            </div>

                            {authError && (
                                <div className="p-3 rounded-xl bg-red-50 border border-red-300 text-red-700 text-xs font-bold leading-relaxed">
                                    {authError}
                                </div>
                            )}

                            <button
                                type="submit"
                                disabled={isValidating}
                                className="w-full bg-[#16a34a] hover:bg-[#15803d] disabled:bg-slate-400 text-white font-extrabold py-3.5 px-4 rounded-xl shadow-md transition-colors text-[15px]"
                            >
                                {isValidating ? 'Verificando credenciales...' : 'Ingresar al Sistema'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        const DEFAULT_TEMPLATE = `Estimado cliente: \n*{nombre}*\nEl area especializada de cobranza de CREDIBAN, le hace recordar que tiene {cuotasMora} cuota(s) pendiente(s) de pago lo cual esta generando interes moratorio.\nContactar con su asesor de credito.\nSiempre atento a brindarle asesoramiento continuo.\nSi ejecuto su pago omite el mensaje.\nCREDIBAN, creciendo contigo.`;

            const [isClearModalOpen, setIsClearModalOpen] = React.useState(false);

            const [asesorToDelete, setAsesorToDelete] = React.useState('');

            const clients = React.useMemo(() => {

            }, [gridRows, statusMap]);

            const missingColumnsAudit = React.useMemo(() => {

            const [activeTab, setActiveTab] = React.useState(() => {

            const [searchTerm, setSearchTerm] = React.useState('');

            const [pasteFeedback, setPasteFeedback] = React.useState(null);

            const [isQueueModalOpen, setIsQueueModalOpen] = React.useState(false);
            const [isTemplateModalOpen, setIsTemplateModalOpen] = React.useState(false);
            const [messageTemplate, setMessageTemplate] = React.useState(DEFAULT_TEMPLATE);
            const [queueClients, setQueueClients] = React.useState([]);
            const [queueIndex, setQueueIndex] = React.useState(0);

            React.useEffect(() => {
                try {
                    const nonEmpty = gridRows.filter(r => !isRowEmpty(r));
                    localStorage.setItem(STORAGE_GRID_KEY, JSON.stringify(nonEmpty));

            }, [gridRows]);

            React.useEffect(() => {
                try {
                    localStorage.setItem(STORAGE_STATUS_KEY, JSON.stringify(statusMap));
                } catch (e) {}
            }, [statusMap]);

            // ========================================================================
            // PEGADO ACUMULATIVO EN BLOQUE + HISTORIAL PARA DESHACER ÚLTIMO BLOQUE
            // ========================================================================
            const handlePopulateExcelFromText = React.useCallback((rawText, origen = 'Bloque Pegado') => {
                const { rows: extractedRows, maxColsDetected, incompleteRowsCount } = convertPastedTextToExcelRows(rawText);
                if (extractedRows.length === 0) {
                    alert("⚠️ No se detectaron celdas válidas en el portapapeles. Selecciona las 19 columnas en tu Excel, presiona Ctrl+C y luego Ctrl+V aquí.");

                if (maxColsDetected < EXPECTED_COLUMN_COUNT) {
                    const faltantes = EXCEL_COLUMNS.slice(maxColsDetected).map(c => `${c.num}. ${c.label}`).join(', ');
                    setColumnWarning({
                        detected: maxColsDetected,
                        expected: EXPECTED_COLUMN_COUNT,
                        incompleteRowsCount,
                        missingList: faltantes
                    });
                } else {
                    setColumnWarning(null);
                }

                // Identificar de qué asesor(es) es este bloque recién pegado para mostrarlo en el botón Deshacer
                const detectedAdvisors = [...new Set(
                    extractedRows
                        .map(r => {
                            const joined = Object.values(r).join(' ');
                            if (joined.toUpperCase().includes('ASESOR:')) {
                                const cell = Object.values(r).find(v => v && String(v).toUpperCase().includes('ASESOR:'));
                                return cell ? String(cell).replace(/ASESOR:/i, '').trim() : '';
                            }
                            return String(r.asesor || '').trim();
                        })
                        .filter(Boolean)
                )];
                const batchLabel = detectedAdvisors.length > 0
                    ? detectedAdvisors.join(', ')
                    : `${extractedRows.length} filas`;

                setGridRows(prevGrid => {
                    const existingOccupied = prevGrid.filter(r => !isRowEmpty(r));
                    // Guardamos instantánea en la pila de deshacer antes de agregar el nuevo bloque
                    setBatchHistory(prevHist => [
                        ...prevHist.slice(-19),
                        {
                            previousOccupiedRows: existingOccupied,
                            addedCount: extractedRows.length,
                            label: batchLabel,
                            hora: new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' })
                        }
                    ]);

                    const combinedOccupied = [...existingOccupied, ...extractedRows];
                    const targetTotal = Math.max(INITIAL_ROW_COUNT, combinedOccupied.length + 30);
                    const nextGrid = padGridToMinimum(combinedOccupied, targetTotal);

                    const unifiedPreview = unifyFromExcelGrid(combinedOccupied, statusMap);
                    setPasteFeedback({
                        origen,
                        filasAnadidas: extractedRows.length,
                        totalFilasOcupadas: combinedOccupied.length,
                        colsDetectadas: maxColsDetected,
                        lineasUnificadas: unifiedPreview.length,
                        asesorBloque: batchLabel,
                        hora: new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' })
                    });

                    return nextGrid;
                });
            }, [statusMap]);

            // DESHACER EL ÚLTIMO BLOQUE AÑADIDO (1 CLIC)
            const handleUndoLastBatch = () => {
                if (batchHistory.length === 0) return;
                const lastBatch = batchHistory[batchHistory.length - 1];
                const restoredGrid = padGridToMinimum(lastBatch.previousOccupiedRows, INITIAL_ROW_COUNT);
                setGridRows(restoredGrid);
                setBatchHistory(prev => prev.slice(0, -1));
                setColumnWarning(null);
                setPasteFeedback({
                    origen: '↩️ Bloque Deshecho',
                    filasAnadidas: 0,
                    totalFilasOcupadas: lastBatch.previousOccupiedRows.length,
                    colsDetectadas: 19,
                    lineasUnificadas: unifyFromExcelGrid(lastBatch.previousOccupiedRows, statusMap).length,
                    asesorBloque: `Se eliminó el bloque: ${lastBatch.label} (-${lastBatch.addedCount} filas)`,
                    hora: new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' })
                });
            };

            // ELIMINAR TODAS LAS FILAS DE UN ASESOR ESPECÍFICO
            const handleDeleteAdvisorBlock = (advisorName) => {
                if (!advisorName) return;

                if (clientsOfAdvisor.length === 0) return;

                const rowIndicesToRemove = new Set();
                clientsOfAdvisor.forEach(c => {
                    (c.gridRowIndices || []).forEach(idx => rowIndicesToRemove.add(idx));
                });

                setGridRows(prevGrid => {
                    const currentOccupied = prevGrid.filter(r => !isRowEmpty(r));
                    const remainingRows = prevGrid.filter((r, idx) => {
                        if (isRowEmpty(r)) return false;
                        if (rowIndicesToRemove.has(idx)) return false;
                        const joined = Object.values(r).join(' ').toUpperCase();
                        if (joined.includes('ASESOR:') && joined.includes(advisorName.toUpperCase())) return false;
                        return true;
                    });

                    setBatchHistory(prevHist => [
                        ...prevHist.slice(-19),
                        {
                            previousOccupiedRows: currentOccupied,
                            addedCount: currentOccupied.length - remainingRows.length,
                            label: `Asesor ${advisorName}`,
                            hora: new Date().toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' })
                        }
                    ]);

                    return padGridToMinimum(remainingRows, INITIAL_ROW_COUNT);

                    const pastedText = clipboardData.getData('Text');

                    if (pastedText && (pastedText.includes('\t') || pastedText.split(/\r?\n/).filter(Boolean).length > 1)) {
                        if (isTemplateModalOpen || isClearModalOpen) return;
                        e.preventDefault();
                        handlePopulateExcelFromText(pastedText, 'Bloque Pegado (Ctrl+V)');

                window.addEventListener('paste', onGlobalPaste);

            const asesoresList = [...new Set(clients.map(c => String(c.asesor || 'Sin Asesor')))].sort();

            // VALIDACIÓN DE PERMISO DE CAJERO PARA ELIMINAR / LIMPIAR TODA LA BASE

            const selectedCount = clients.filter(c => c.selected).length;

            const getFilePrefix = () => {

            // ---- PDF 1: RPT. LLAMADAS ----

                        c.montoCancelarCapInt > 0 ? `S/ ${c.montoCancelarCapInt.toFixed(2)}` : '-',
                        c.cuotaMasAntiguaBase > 0 ? `S/ ${c.cuotaMasAntiguaBase.toFixed(2)}` : '-',

                                if (!isNaN(val)) {
                                    data.cell.text = `${val} días`;
                                    const color = getMoraColor(val);
                                    data.cell.styles.fillColor = color.bg;
                                    data.cell.styles.textColor = color.text;
                                    data.cell.styles.fontStyle = 'bold';
                                }
                            }
                        },
                        margin: { top: 15 }
                    });
                });
                doc.save(`${getFilePrefix()}Rpt_Asignacion_Mora.pdf`);

            const nonEmptyGridRowsCount = gridRows.filter(r => !isRowEmpty(r)).length;
            const globalMeta = clients.reduce((sum, c) => sum + (Number(c.totalCobrarHoy) || 0), 0);

                                                                {visibleCols.intMora && (
                                                                    <td className="px-2.5 py-3.5 text-sm text-right text-orange-600 font-medium whitespace-nowrap">
                                                                        {client.moraGeneradaVencida > 0 ? `S/ ${client.moraGeneradaVencida.toFixed(2)}` : '-'}
                                                                    </td>
                                                                )}

                                                                <td className="px-3 py-3.5 text-sm text-right font-bold text-red-700 bg-red-50/50 border-l border-r border-red-100 whitespace-nowrap">
                                                                    {client.totalCobrarHoy > 0 ? `S/ ${client.totalCobrarHoy.toFixed(2)}` : 'S/ 0.00'}
                                                                </td>

                                                                <td className="px-2 py-3.5 whitespace-nowrap text-center border-l border-gray-100">
                                                                    <button
                                                                        onClick={() => sendIndividualWhatsApp(client)}
                                                                        title="Enviar Mensaje Directo"
                                                                        className="inline-flex items-center justify-center p-2 rounded-full bg-green-50 text-green-600 hover:bg-green-100 border border-green-200"
                                                                    >
                                                                        📲
                                                                    </button>
                                                                </td>
                                                                <td className="px-1 py-3.5 text-center">
                                                                    <select
                                                                        className={`text-[10px] rounded-full px-1 py-1 w-24 font-semibold border focus:outline-none ${getDropdownColor(client.estadoLlamada)}`}
                                                                        value={client.estadoLlamada}
                                                                        onChange={(e) => handleStatusChange(client.id, 'estadoLlamada', e.target.value)}
                                                                    >
                                                                        {LLAMADA_OPTIONS.map(opt => <option key={opt} value={opt} className="bg-white text-gray-800">{opt}</option>)}
                                                                    </select>
                                                                </td>
                                                                <td className="px-1 py-3.5 text-center">
                                                                    <select
                                                                        className={`text-[10px] rounded-full px-1 py-1 w-24 font-semibold border focus:outline-none ${getDropdownColor(client.estadoWA)}`}
                                                                        value={client.estadoWA}
                                                                        onChange={(e) => handleStatusChange(client.id, 'estadoWA', e.target.value)}
                                                                    >
                                                                        {WA_OPTIONS.map(opt => <option key={opt} value={opt} className="bg-white text-gray-800">{opt}</option>)}
                                                                    </select>
                                                                </td>
                                                            </tr>

                                                            {/* ACORDEÓN DESPLEGABLE DE CUOTAS */}
                                                            {isExpanded && (
                                                                <tr className="bg-slate-100 border-b-2 border-slate-300">
                                                                    <td colSpan={16} className="p-4">
                                                                        <div className="bg-white rounded-xl p-4 shadow-inner border border-slate-200">
                                                                            <div className="flex flex-wrap justify-between items-start gap-3 mb-3 pb-2 border-b border-slate-100">
                                                                                <div>
                                                                                    <h4 className="text-sm font-extrabold text-slate-800">
                                                                                        📊 Desglose de Línea de Crédito — {toTitleCase(client.nombre)}
                                                                                        {client.credito && <span className="ml-2 text-xs bg-slate-100 px-2 py-0.5 rounded">Crédito #{client.credito}</span>}
                                                                                        <span className="ml-2 text-xs bg-emerald-50 text-emerald-800 px-2 py-0.5 rounded border border-emerald-200">
                                                                                            Desembolso: S/ {client.montoDesembolsado.toFixed(2)} | Plazo: {client.plazoRaw}
                                                                                        </span>
                                                                                    </h4>
                                                                                    <p className="text-xs text-slate-600 mt-1">
                                                                                        📍 <strong>Dirección:</strong> {client.direccion || 'No registrada'} | 🧭 <strong>Referencia:</strong> {client.referencia || 'Sin referencia'}
                                                                                    </p>
                                                                                </div>
                                                                                <div className="flex gap-2 text-xs font-bold">
                                                                                    <span className="bg-red-50 text-red-700 px-2.5 py-1 rounded border border-red-200">
                                                                                        Exigible Hoy (Atraso &ge; 0): S/ {client.totalCobrarHoy.toFixed(2)}
                                                                                    </span>
                                                                                    <span className="bg-emerald-50 text-emerald-700 px-2.5 py-1 rounded border border-emerald-200">
                                                                                        Falta Pagar (Atraso &lt; 0): S/ {client.montoPorVencerFuturo.toFixed(2)}
                                                                                    </span>
                                                                                </div>
                                                                            </div>

                                                                            {client.tieneParalela && client.otrasLineasResumen.length > 0 && (
                                                                                <div className="mb-3 p-2.5 bg-purple-50 border border-purple-200 rounded-lg text-xs text-purple-900 flex flex-wrap justify-between items-center gap-2">
                                                                                    <span><strong>⚡ Líneas Paralelas de {toTitleCase(client.nombre)}:</strong></span>
                                                                                    <div className="flex flex-wrap gap-2">
                                                                                        {client.otrasLineasResumen.map((ol, i) => (
                                                                                            <span key={i} className="bg-white px-2.5 py-1 rounded border border-purple-300 font-bold">
                                                                                                {ol.credito ? `Créd #${ol.credito}` : 'Otra Línea'} • Desembolso: S/ {ol.desembolso.toFixed(2)} ({ol.plazoRaw}) • Atraso: {ol.maxAtraso}d • Exigible: S/ {ol.totalCobrarHoy.toFixed(2)}
                                                                                            </span>
                                                                                        ))}
                                                                                    </div>
                                                                                </div>
                                                                            )}

                                                                            <table className="min-w-full text-xs border border-slate-200 rounded-lg overflow-hidden">
                                                                                <thead className="bg-slate-800 text-white uppercase text-[10px]">
                                                                                    <tr>
                                                                                        <th className="py-2 px-3 text-center">N CUOTA (Col 3)</th>
                                                                                        <th className="py-2 px-3 text-center">ATRASO (Col 5)</th>
                                                                                        <th className="py-2 px-3 text-center">Estado de Cuota</th>
                                                                                        <th className="py-2 px-3 text-right">CUOTA ORIG (Col 16)</th>
                                                                                        <th className="py-2 px-3 text-right">MORA CUOTA (Col 17)</th>
                                                                                        <th className="py-2 px-3 text-right">SALDO K CUOTA (Col 8)</th>
                                                                                        <th className="py-2 px-3 text-right">SALDO- CUOTA (Col 7)</th>
                                                                                    </tr>
                                                                                </thead>
                                                                                <tbody className="divide-y divide-slate-200">
                                                                                    {client.cuotasDetalle.map((cDet, idx) => {
                                                                                        const isMora = cDet.atraso > 0;
                                                                                        const isHoy = cDet.atraso === 0;
                                                                                        return (
                                                                                            <tr key={idx} className={isMora ? 'bg-red-50/40' : isHoy ? 'bg-yellow-50/50' : 'bg-emerald-50/20'}>
                                                                                                <td className="py-2 px-3 text-center font-extrabold">Cuota #{cDet.nCuota}</td>
                                                                                                <td className="py-2 px-3 text-center font-black">
                                                                                                    <span className={`px-2 py-0.5 rounded ${isMora ? 'bg-red-100 text-red-800' : isHoy ? 'bg-yellow-200 text-yellow-900' : 'bg-emerald-100 text-emerald-800'}`}>
                                                                                                        {cDet.atraso} días
                                                                                                    </span>
                                                                                                </td>
                                                                                                <td className="py-2 px-3 text-center font-bold">
                                                                                                    {isMora ? (
                                                                                                        <span className="text-red-700">🚨 Días de Mora</span>
                                                                                                    ) : isHoy ? (
                                                                                                        <span className="text-amber-700">⚠️ Vence Hoy</span>
                                                                                                    ) : (
                                                                                                        <span className="text-emerald-700">✅ Falta Pagar (Vence en {Math.abs(cDet.atraso)}d)</span>
                                                                                                    )}
                                                                                                </td>
                                                                                                <td className="py-2 px-3 text-right">S/ {cDet.cuotaOrig.toFixed(2)}</td>
                                                                                                <td className="py-2 px-3 text-right text-orange-600 font-semibold">S/ {cDet.moraCuota.toFixed(2)}</td>
                                                                                                <td className="py-2 px-3 text-right text-green-700 font-semibold">S/ {cDet.saldoKCuota.toFixed(2)}</td>
                                                                                                <td className="py-2 px-3 text-right font-extrabold text-slate-900">S/ {cDet.saldoCuota.toFixed(2)}</td>
                                                                                            </tr>
                                                                                        );
                                                                                    })}
                                                                                </tbody>
                                                                            </table>
                                                                        </div>
                                                                    </td>
                                                                </tr>
                                                            )}
                                                        </React.Fragment>
                                                    );
                                                })}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        function App() {
            const [currentUser, setCurrentUser] = React.useState(() => {
                try {
                    const saved = localStorage.getItem(STORAGE_SESSION_KEY);
                    if (saved) {
                        const parsed = JSON.parse(saved);
                        if (parsed && isCajeroRole(parsed.categoria)) return parsed;
                    }
                } catch (e) {}
                return null;
            });

            const [usersList, setUsersList] = React.useState(() => {
                try {
                    const cached = localStorage.getItem(STORAGE_USERS_CACHE_KEY);
                    return cached ? JSON.parse(cached) : [];
                } catch (e) {
                    return [];
                }
            });
            const [isLoadingUsers, setIsLoadingUsers] = React.useState(false);
            const [syncError, setSyncError] = React.useState(false);

            const syncUsersFromNetwork = React.useCallback(async () => {
                setIsLoadingUsers(true);
                setSyncError(false);
                const endpointsToTry = [
                    USER_NETWORK_SCRIPT_URL,
                    `${USER_NETWORK_SCRIPT_URL}?action=getUsuarios`,
                    `${USER_NETWORK_SCRIPT_URL}?action=usuarios`,
                    `${USER_NETWORK_SCRIPT_URL}?hoja=USUARIOS`
                ];

                for (let url of endpointsToTry) {
                    try {
                        const response = await fetch(url);
                        if (response.ok) {
                            const data = await response.json();
                            const normalized = normalizeUsersFromPayload(data);
                            if (normalized.length > 0) {
                                setUsersList(normalized);
                                try {
                                    localStorage.setItem(STORAGE_USERS_CACHE_KEY, JSON.stringify(normalized));
                                } catch (e) {}
                                setIsLoadingUsers(false);
                                return;
                            }
                        }
                    } catch (err) {
                        // Intentar siguiente formato de endpoint
                    }
                }

                setIsLoadingUsers(false);
                setSyncError(true);
            }, []);

            React.useEffect(() => {
                syncUsersFromNetwork();
            }, [syncUsersFromNetwork]);

            const handleLoginSuccess = (userObj, remember) => {
                setCurrentUser(userObj);
                if (remember) {
                    try {
                        localStorage.setItem(STORAGE_SESSION_KEY, JSON.stringify(userObj));
                    } catch (e) {}
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                localStorage.removeItem(STORAGE_SESSION_KEY);
            };

            if (!currentUser) {
                return (
                    <LoginScreen
                        onLoginSuccess={handleLoginSuccess}
                        usersList={usersList}
                        isLoadingUsers={isLoadingUsers}
                        syncError={syncError}
                        onRetrySync={syncUsersFromNetwork}
                    />
                );
            }

            return (
                <CobranzasDashboard
                    currentUser={currentUser}
                    usersList={usersList}
                    onLogout={handleLogout}
                />
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
